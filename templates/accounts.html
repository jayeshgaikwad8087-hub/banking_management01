{% extends "base.html" %}{% block content %}<h1>Accounts</h1><a class="btn" href="/accounts/add">+ Open Account</a><table><tr><th>Account</th><th>Customer</th><th>Type</th><th>Balance</th><th>Status</th></tr>{% for x in accounts %}<tr><td>{{x.account_no}}</td><td>{{x.customer}}</td><td>{{x.type}}</td><td>₹{{x.balance}}</td><td>{{x.status}}</td></tr>{% else %}<tr><td colspan="5">No records.</td></tr>{% endfor %}</table>{% endblock %}
