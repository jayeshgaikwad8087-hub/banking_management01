{% extends "base.html" %}{% block content %}<h1>Customers</h1><a class="btn" href="/customers/add">+ Add Customer</a><table><tr><th>Name</th><th>Email</th><th>Phone</th><th>Address</th><th>Action</th></tr>{% for x in customers %}<tr><td>{{x.name}}</td><td>{{x.email}}</td><td>{{x.phone}}</td><td>{{x.address}}</td><td><a class="danger" href="/customers/delete/{{x._id}}">Delete</a></td></tr>{% else %}<tr><td colspan="5">No records.</td></tr>{% endfor %}</table>{% endblock %}
