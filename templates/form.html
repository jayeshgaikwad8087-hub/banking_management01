{% extends "base.html" %}{% block content %}<h1>{{title}}</h1><form method="post">{% for f in fields %}{% if f=="type" %}<select name="type"><option>Savings</option><option>Current</option><option>Personal Loan</option><option>Home Loan</option><option>Business Loan</option></select>{% elif f=="status" %}<select name="status"><option>Active</option><option>Pending</option><option>Approved</option><option>Rejected</option><option>Closed</option></select>{% else %}<input name="{{f}}" placeholder="{{f.replace('_',' ').title()}}" {% if f in ["name","account_no","customer","amount"] %}required{% endif %}>{% endif %}{% endfor %}<button class="btn">Save</button></form>{% endblock %}
