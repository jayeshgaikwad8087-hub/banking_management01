{% extends "base.html" %}{% block content %}<h1>Transactions</h1><form method="post"><input name="account_no" placeholder="Account No" required><select name="type"><option>Deposit</option><option>Withdrawal</option><option>Transfer</option></select><input name="amount" type="number" step=".01" placeholder="Amount" required><input name="description" placeholder="Description"><button class="btn">Save</button></form><table><tr><th>Account</th><th>Type</th><th>Amount</th><th>Description</th></tr>{% for x in transactions %}<tr><td>{{x.account_no}}</td><td>{{x.type}}</td><td>₹{{x.amount}}</td><td>{{x.description}}</td></tr>{% else %}<tr><td colspan="4">No records.</td></tr>{% endfor %}</table>{% endblock %}
